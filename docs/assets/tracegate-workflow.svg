<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TraceGate workflow</title>
  <desc id="desc">A workflow diagram showing an agent runner passing tool calls through TraceGate contracts, policy gates, redaction, traces, matrix tests, replay fixtures, CI, and observability exports.</desc>
  <rect width="1200" height="640" rx="28" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1152" height="592" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>

  <text x="72" y="82" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="32" font-weight="700" fill="#0F172A">TraceGate keeps tool-using agents testable</text>
  <text x="72" y="116" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#475569">Define tool contracts once, enforce them at runtime, then replay behavior in CI when prompts, models, or code change.</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10V2Z" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="72" y="174" width="190" height="132" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="96" y="212" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="700" fill="#0F172A">Agent runner</text>
    <text x="96" y="242" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#475569">OpenAI Agents</text>
    <text x="96" y="266" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#475569">LangGraph</text>
    <text x="96" y="290" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#475569">Your own loop</text>
  </g>

  <path d="M262 240H335" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="352" y="158" width="246" height="164" rx="16" fill="#ECFEFF" stroke="#0891B2"/>
    <text x="384" y="198" font-family="Inter, ui-sans-serif, system-ui" font-size="20" font-weight="700" fill="#164E63">TraceGate harness</text>
    <text x="384" y="230" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#155E75">wrapTool(contract, execute)</text>
    <text x="384" y="256" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#155E75">validate input before execution</text>
    <text x="384" y="282" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#155E75">record ordered runtime events</text>
  </g>

  <path d="M598 240H671" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="688" y="146" width="200" height="92" rx="14" fill="#FFFBEB" stroke="#D97706"/>
    <text x="714" y="180" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="700" fill="#78350F">Policy gate</text>
    <text x="714" y="207" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#92400E">allow, review, block</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="688" y="258" width="200" height="92" rx="14" fill="#FFF1F2" stroke="#E11D48"/>
    <text x="714" y="292" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="700" fill="#881337">Redaction</text>
    <text x="714" y="319" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#9F1239">remove common secrets</text>
  </g>

  <path d="M888 240H961" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="978" y="174" width="150" height="132" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="1002" y="212" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="700" fill="#0F172A">Real tool</text>
    <text x="1002" y="242" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#475569">email</text>
    <text x="1002" y="266" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#475569">database</text>
    <text x="1002" y="290" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#475569">HTTP API</text>
  </g>

  <path d="M475 322V400" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M788 350V400" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="116" y="416" width="222" height="112" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="142" y="452" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="700" fill="#0F172A">JSONL traces</text>
    <text x="142" y="480" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#475569">run, tool, evidence events</text>
    <text x="142" y="506" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#475569">local-first debug artifacts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="368" y="416" width="222" height="112" rx="14" fill="#F0FDF4" stroke="#16A34A"/>
    <text x="394" y="452" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="700" fill="#14532D">Matrix tests</text>
    <text x="394" y="480" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#166534">required and forbidden tools</text>
    <text x="394" y="506" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#166534">policy, evidence, output shape</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="416" width="222" height="112" rx="14" fill="#EEF2FF" stroke="#4F46E5"/>
    <text x="646" y="452" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="700" fill="#312E81">Replay fixtures</text>
    <text x="646" y="480" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#3730A3">compare stable behavior</text>
    <text x="646" y="506" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#3730A3">ignore ids and timestamps</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="872" y="416" width="222" height="112" rx="14" fill="#FAF5FF" stroke="#9333EA"/>
    <text x="898" y="452" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="700" fill="#581C87">CI and exports</text>
    <text x="898" y="480" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#6B21A8">JUnit, JSON reports</text>
    <text x="898" y="506" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#6B21A8">OTel, Langfuse, Braintrust</text>
  </g>

  <path d="M338 472H351" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M590 472H603" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M842 472H855" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
