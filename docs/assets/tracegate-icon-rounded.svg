<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TraceGate icon</title>
  <desc id="desc">A rounded-square TraceGate icon showing a branching trace with colored nodes and a dotted path to an orange endpoint.</desc>
  <defs>
    <filter id="cardShadow" x="88" y="88" width="848" height="848" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="42" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="tealNode" x1="195" y1="428" x2="337" y2="570" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cyanNode" x1="642" y1="399" x2="754" y2="511" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="violetNode" x1="607" y1="264" x2="719" y2="376" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="violetNode2" x1="607" y1="640" x2="719" y2="752" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="orangeNode" x1="760" y1="490" x2="872" y2="602" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="transparent"/>
  <rect x="112" y="112" width="800" height="800" rx="190" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="113" y="113" width="798" height="798" rx="189" stroke="#E2E8F0" stroke-opacity="0.55" stroke-width="2"/>

  <path
    d="M270 500H382C437 500 454 463 462 403C470 345 485 304 544 304H619"
    stroke="#1D4ED8"
    stroke-width="30"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M382 500C430 500 446 464 488 464H660"
    stroke="#1D4ED8"
    stroke-width="30"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M382 500C440 500 456 561 463 632C468 691 489 720 544 720H619"
    stroke="#1D4ED8"
    stroke-width="30"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M506 540C574 566 660 564 754 540"
    stroke="#1D4ED8"
    stroke-width="22"
    stroke-linecap="round"
    stroke-dasharray="1 47"
  />

  <g filter="url(#nodeShadow)">
    <circle cx="266" cy="500" r="72" fill="url(#tealNode)"/>
    <circle cx="663" cy="304" r="56" fill="url(#violetNode)"/>
    <circle cx="698" cy="464" r="56" fill="url(#cyanNode)"/>
    <circle cx="663" cy="720" r="56" fill="url(#violetNode2)"/>
    <circle cx="816" cy="546" r="56" fill="url(#orangeNode)"/>
  </g>
</svg>
